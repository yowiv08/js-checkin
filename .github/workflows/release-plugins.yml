name: Release js-checkin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
          npm run test:build
          npm run test:release
      - name: Build
        run: npm run build
      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $null }
          ./package-release.ps1 -Tag $tag
          $index = Get-Content -LiteralPath ./artifacts/release/release-index.json -Raw | ConvertFrom-Json
          "tag=$($index.tag)" >> $env:GITHUB_OUTPUT
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: js-checkin-${{ steps.package.outputs.tag }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: js-checkin-${{ needs.build.outputs.tag }}
          path: artifacts/release
      - name: Publish GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/release/js-checkin.zip \
            artifacts/release/js-checkin.zip.sha256 \
            artifacts/release/release-index.json \
            --verify-tag --title "js-checkin $RELEASE_TAG" \
            --generate-notes --notes-file artifacts/release/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false
